# checkpoint name
pretrained_model_name_or_path: hf_cache/black-forest-labs--FLUX.1-dev
clip_path: ViT-B/32 # or simply "ViT-B/32" and let transformers module do its job
output_dir: experiments/train/train_sdxl
vae_path: madebyollin/sdxl-vae-fp16-fix

# checkpoint_path: experiments/staged_training/checkpoint-39790 # e.g. checkpoint-200000
