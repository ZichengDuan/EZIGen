# I/O
pretrained_model_name_or_path: hf_cache/black-forest-labs--FLUX.1-dev
clip_path: ViT-B/32 # or simply "ViT-B/32" and let transformers module do its job
output_dir: experiments/train/train_sdxl_pure_hd
# vae_path: hf_cache/madebyollin--sdxl-vae-fp16-fix

# UNet configs
add_before_ca: true # determine where to register the adapter, before_ca indicates before cross-attention
skip_adapter_ratio: 0

# subject extraction settings
sub_feat_position: "before_sa" # where to extract subject feature: [before_sa], after_sa, after_ca, after_ff
subject_timestep: 1

# text related settings
drop_text_ratio: 0
remove_add_text_emb: false
 
# datasets
train_batch_size: 1
train_data_ratio: 1
resolution: 512
drop_reference_ratio: 0
with_rotation: false
with_scale: false
with_staged_timestep: true

with_coco: false
with_youtube_vis: false
with_vitonhd: false
with_subject200k: true
with_subject200k_jigsaw: false

num_sub_img: 1
coco2014:
  subset_size: 100000
  data_path: data/coco2014
  train_split: "trainval"

youtubeVIS:
  subset_size: 100000
  image_dir: data/YoutubeVIS_ori/JPEGImages
  anno: data/YoutubeVIS_ori/Annotations/
  meta: data/YoutubeVIS_ori/meta.json

subject200k:
  subset_size: 150000
  data_path: "data/Subjects200K_collection3/extracted_pairs"

subject200k_jigsaw:
  subset_size: 100000
  data_path: "data/Subjects200K_collection3/extracted_pairs"

vitonHD_dataset:
  subset_size: 100000
  image_dir: /mnt/sh_nas/duanzicheng.dzc/Projects/EZIGen/data/VITON-HD/train/cloth

# training
num_train_epochs: 1
checkpointing_steps: 1
validation_steps: 1
learning_rate: 0.0001
lr_scheduler: "constant"
lr_warmup_steps: 0
seed: 42
local_rank: -1
dataloader_num_workers: 16

# validation and checkpointing
checkpoints_total_limit: 3
resume_from_checkpoint: latest
dreambench_output_dir: null
report_to: "tensorboard"
tracker_project_name: "tensorboard"
logging_dir: logs
infer_logging_dir: logs_infer

# validation and inference setting
infer_steps: 20
initial_loop: false
split_ratio: 0.4

# validation images
target_prompt_1: "a backpack on the beach."
subject_prompt_1:  
  - "a photo of a backpack."
subject_img_paths_1:
  - "example_images/subjects/backpack.png"

target_prompt_2: "a dog under a tree."
subject_prompt_2: 
  - "a photo of a dog."
subject_img_paths_2:
  - "example_images/subjects/corgi_1024.png"

target_prompt_3: "a dog in police outfit."
subject_prompt_3: 
  - "a photo of a dog."
subject_img_paths_3:
  - "example_images/subjects/corgi_1024.png"

target_prompt_4: "a woman wearing a rainbow scarf."
subject_prompt_4: 
  - "a photo of a woman."
subject_img_paths_4:
  - "example_images/subjects/lff_1024.png"


# defaults
gradient_accumulation_steps: 1
revision: null
non_ema_revision: null
enable_xformers_memory_efficient_attention: false
allow_tf32: false
scale_lr: false
use_8bit_adam: false
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 0.01
adam_epsilon: 0.00000001
max_grad_norm: 1.0
push_to_hub: false
hub_token: null
prediction_type: null
hub_model_id: null
max_train_steps: null
snr_gamma: null
residual_connection: true
variant: null
config: dummy_config.yaml # dummy placeholder for argparser
mixed_precision: 'fp16'

# configs used only during inference, no need to change
do_editing: false # this is used 
num_interations: -1
init_image_path: null